<!doctype html>
<html><head><meta charset="utf-8"><title>loud</title><style>
  :root { --r: 999px; --bg: #2b1b1b; --accent: #ff9a7c; }
  body { margin:0; background:var(--bg); color:#e8ecf2; min-height:100%;
         font:16px/1.6 ui-sans-serif, system-ui, sans-serif;
         display:grid; place-items:center; }
  .card { background:#0f141b; border:1px solid #2a3543; border-radius:var(--r);
          padding:40px 48px; text-align:center; }
  h2 { margin:0 0 10px; font-size:30px; letter-spacing:-.02em; }
  .tag { color:var(--accent); font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
</style></head><body>
  <div class="card"><h2>loud</h2><div class="tag">radius 999px</div></div>
</body></html>
